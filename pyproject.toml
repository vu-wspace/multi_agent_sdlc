[project]
name = "multi-agent-sdlc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vu Truong Anh", email = "vu.wspace@gmail.com" }
]
requires-python = ">=3.13.16"
dependencies = [
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary]>=3.3.9",
    "pycryptodome>=4.5.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "truststore>=0.10.5",
]

[project.scripts]
multi-agent-sdlc = "multi_agent_sdlc:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
